name: Windows GUI build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
            requirements-dev.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit and GUI tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build Windows onedir application
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipTests

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: 12306FairTicket-windows-py312
          path: dist/12306FairTicket
          if-no-files-found: error
          retention-days: 14
